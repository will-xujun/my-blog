name: Deploy Forester to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3
          dune-cache: true

      - name: Diagnose OPAM dependencies
        run: |
          echo "=== Installed packages ==="
          opam list --installed --columns=name,version

          echo "=== OPAM pins ==="
          opam pin list

          echo "=== LSP package metadata ==="
          opam show lsp --field=all-versions
            - name: Pin compatible LSP version
              run: |
                opam pin add lsp 1.23.1 --kind version --yes

      - name: Pin LSP
        run: opam pin add lsp 1.23.1 --kind version --yes

      - name: Verify LSP pin
        run: opam list --installed --columns=name,version

      - name: Install Forester
        run: |
          opam install forester --yes
      
      - name: Build forest
        run: |
          eval "$(opam env)"
          forester build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
