name: Deploy Forester Website

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
 
     - name: Checkout repository
        uses: actions/checkout@v6

     - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          texlive_version: 2025
          packages: >
            scheme-basic standalone preview dvisvgm amsfonts amsmath
            amscls cclicenses enumitem etoolbox hyperref mathpartir
            ebproof quiver pgf spath3 mathtools microtype stmaryrd
            thmtools tikz-cd tikz-nfold xcolor
      
      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3
          dune-cache: true

      - name: Install Forester
        run: opam install forester.5.0 lsp.1.23.1

      - name: Inspect repository structure
        run: |
          pwd
          ls -la
          find . -name forest.toml

      - name: build with Forester
        run: opam exec -- forester build

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/my-blog/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
